<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12162B">
<title>Quiz – live screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root { --bg: #12162B; --text: #F2F4FF; --muted: #8D95C2; font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body.idle { cursor: none; }
/* The two screens of the quiz laptop, shown read-only. Only the one the laptop
   is on is visible; both stay loaded so switching is instant. */
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; visibility: hidden; }
iframe.on { visibility: visible; }
.start { position: fixed; inset: 0; z-index: 5; background: var(--bg); color: var(--text); display: grid; place-items: center; text-align: center; cursor: pointer; }
.start[hidden] { display: none; }
.start b { display: block; font-size: clamp(26px, 4vw, 64px); font-weight: 800; }
.start span { display: block; margin-top: 12px; font-size: clamp(14px, 1.6vw, 26px); color: var(--muted); }
</style>
</head>
<body>
<iframe id="fBoard" class="on" src="scoreboard.html?mirror=1" title="Scoreboard" tabindex="-1"></iframe>
<iframe id="fBuzz" src="host.html?mirror=1" title="Buzzer round" tabindex="-1"></iframe>
<div class="start" id="start"><div><b>Click anywhere to start</b><span>Shows the quiz laptop’s screen, full screen, with sound</span></div></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="config.js?v=5"></script>
<script src="relay.js?v=1"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);

  /* ---------- which screen is the laptop on? ---------- */
  function show(page) {
    $('#fBoard').classList.toggle('on', page !== 'buzzer');
    $('#fBuzz').classList.toggle('on', page === 'buzzer');
  }
  let page = 'board';

  /* ---------- sound: the display system plays it for the hall ---------- */
  let AC = null;
  function ac() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (AC && AC.state === 'suspended') AC.resume();
    preloadBuzzSound(AC);
    return AC;
  }
  function tone(f, d, type, v, w) {
    const a = AC; if (!a || a.state !== 'running') return;
    const t = a.currentTime + (w || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.03);
  }
  const sUp = () => { tone(660, .1, 'triangle', .25); tone(880, .1, 'triangle', .25, .1); tone(1100, .25, 'triangle', .25, .2); };
  const sDown = () => tone(160, .4, 'square', .2);
  const sOpen = () => { tone(880, .08, 'sine', .22); tone(1320, .14, 'sine', .22, .09); };
  const sTimeUp = () => tone(220, .7, 'sawtooth', .2);
  const sBuzz = () => { if (AC && AC.state === 'running') playTeamSound(AC, 0, 0.3); };

  // Work out from the laptop's messages when something happened.
  let lastBoardFlash = null, prev = null;
  let timerDone = null;
  function onBoard(m) {
    const done = !!(m && m.timer && m.timer.done);
    if (timerDone === false && done && page !== 'buzzer') sTimeUp();
    timerDone = done;
    const f = m && m.flash;
    if (!f) return;
    if (lastBoardFlash === null) { lastBoardFlash = f.id; return; }      // what was already on screen
    if (f.id === lastBoardFlash) return;
    lastBoardFlash = f.id;
    if (page !== 'buzzer' && f.left > 250) { if (f.kind === 'up') sUp(); else if (f.kind === 'down') sDown(); }
  }
  function onState(m) {
    const ans = (m.order && m.cur < m.order.length) ? m.q + ':' + m.cur + ':' + m.order[m.cur].team : '';
    const res = JSON.stringify(m.results || {});
    const cur = { q: m.q, phase: m.phase, ans, res, results: m.results || {}, left: m.ans };
    if (prev && page === 'buzzer') {
      if (cur.phase === 'open' && (prev.phase !== 'open' || cur.q !== prev.q)) sOpen();
      if (cur.ans && cur.ans !== prev.ans) sBuzz();
      if (cur.res !== prev.res) {
        const gained = Object.keys(cur.results).some(k => (cur.results[k] || 0) > (prev.results[k] || 0));
        const lost = Object.keys(cur.results).some(k => (cur.results[k] || 0) < (prev.results[k] || 0));
        if (gained) sUp(); else if (lost) sDown();
      }
      if (cur.ans && cur.ans === prev.ans && prev.left > 0 && cur.left === 0) sTimeUp();
    }
    prev = cur;
  }

  Relay.connect({
    prefix: 'screen-view', subscribe: ['mode', 'board', 'state'],
    onMessage(topic, m) {
      if (topic === 'mode' && m && m.page) { page = m.page; show(page); }
      else if (topic === 'board') onBoard(m);
      else if (topic === 'state') onState(m);
    }
  });

  /* ---------- full screen ---------- */
  function enterFs() {
    if (document.fullscreenElement || !document.documentElement.requestFullscreen) return;
    document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  }
  $('#start').addEventListener('click', () => { ac(); $('#start').hidden = true; enterFs(); });
  document.addEventListener('pointerdown', () => { ac(); enterFs(); });
  document.addEventListener('keydown', e => { ac(); if (e.key !== 'Escape') { $('#start').hidden = true; enterFs(); } });
  let idleT = null;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000);
  });
})();
</script>
</body>
</html>
